<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <!--
    Torra's web viewer (lib/main_viewer.dart): the recorded roasts on Google
    Drive, for an iPhone. See README.

    /torra-viewer/ is filled in by `flutter build web --base-href`: the path the
    page is served from, with a slash at each end.
  -->
  <base href="/torra-viewer/">

  <meta charset="UTF-8">
  <!--
    The page holds a token for the roasts on Google Drive, so it runs no script but
    its own (google_sign_in's web half, which the apps' sign-in brings along, would
    fetch Google's — the viewer signs in without it) and talks to nobody but Drive
    and, for the Chinese text's font, Google Fonts.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'wasm-unsafe-eval';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob:;
    font-src 'self' data: https://fonts.gstatic.com;
    connect-src 'self' data: blob: https://www.googleapis.com https://fonts.gstatic.com;
    worker-src 'self' blob:;
    base-uri 'self';
    form-action 'none'">
  <meta name="description" content="Torra 烘焙紀錄">
  <meta name="theme-color" content="#F2F2F7">

  <!-- An iPhone's home screen: opened without Safari's bars. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Torra">
  <!-- ?v=: browsers keep a site's icon long after the file has changed; a new number
       here (and in about.html, privacy.html and manifest.json) makes them fetch it again. -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">

  <link rel="icon" type="image/png" href="favicon.png?v=2"/>

  <title>Torra</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* The page's grey (IosColors.background) and a spinner until Flutter has drawn. */
    html, body { height: 100%; margin: 0; background: #F2F2F7; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    }
    #loading::after {
      content: ""; width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid #C7C7CC; border-top-color: #8E8E93; animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading"></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
